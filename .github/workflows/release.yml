name: release
# builds single-file native zip per RID and attaches them to the pushed tag as a GitHub Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, rid: win-x64 }
          - { os: ubuntu-latest, rid: linux-x64 }
          - { os: macos-latest, rid: osx-x64 }
          - { os: macos-latest, rid: osx-arm64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: >
          dotnet publish PZConfigurator -c Release -r ${{ matrix.rid }}
          --self-contained true -p:PublishSingleFile=true
          -p:EnableCompressionInSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=embedded
      - run: |
          cd PZConfigurator/bin/Release/net10.0/${{ matrix.rid }}/publish
          rm -f *.pdb
          zip -r "$GITHUB_WORKSPACE/PZConfigurator-${{ matrix.rid }}.zip" .
        shell: bash
      - uses: actions/upload-artifact@v4
        with:
          name: PZConfigurator-${{ matrix.rid }}
          path: PZConfigurator-${{ matrix.rid }}.zip
  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: PZConfigurator-*.zip
          generate_release_notes: true
